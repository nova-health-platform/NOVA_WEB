<div class="rounded-lg border p-4 space-y-3" [ngClass]="getColorClasses()">
  <div class="flex items-start gap-3">
    <!-- Icon -->
    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-xl">
      {{ getAdvice().icon }}
    </div>
    
    <!-- Content -->
    <div class="flex-1 space-y-2">
      <h4 class="font-semibold text-base">{{ getAdvice().title }}</h4>
      <p class="text-sm leading-relaxed opacity-90">{{ getAdvice().message }}</p>
      
      <!-- Action -->
      <div class="pt-2 border-t border-current/20">
        <p class="text-sm font-medium">{{ getAdvice().action }}</p>
      </div>
    </div>
  </div>
</div>
