<!doctype html>
<html lang="en" class="!scroll-smooth">
<head>

  <title>Nova</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<header class="bg-[#101010]">
  <div class="mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex-1 md:flex md:items-center md:gap-12">
        <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-7">
      </div>
      <div class="md:flex md:items-center md:gap-12">
        <nav aria-label="Global" class="hidden md:block">
          <ul class="flex items-center gap-6 text-sm">
            <li>
              <a
                class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-pink-400"
                href="/"
              >
                Home
              </a>
            </li>
            <li>
              <a
                class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-pink-400"
                href="/analysis"
              >
                Symptom analysis
              </a>
            </li>

            <li>
              <a
                class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-pink-400"
                href="/skinCheck"
              >
                Skin check
              </a>
            </li>

            <li>
              <a
                class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-pink-400"
                href="/mentalHealth"
              >
                Mental health
              </a>
            </li>

            <li>
              <a
                class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-pink-400"
                href="/medecineSearch"
              >
                Medecine search
              </a>
            </li>
          </ul>
        </nav>

        <div class="flex items-center gap-4">
          <div class="sm:flex sm:gap-4">
            <a
              class="rounded-md bg-pink-500 px-5 py-3 text-sm font-medium text-white shadow dark:hover:bg-pink-600"
              href="#"
            >
              Login
            </a>

            <div class="hidden sm:flex">
              <a
                class="rounded-md px-5 py-2.5 text-sm font-medium bg-pink-500/10 border-3 border-pink-500 text-pink-500 dark:text-white hover:bg-pink-500 hover:text-white"
                href="#"
              >
                Register
              </a>
            </div>
          </div>

          <div class="block md:hidden">
            <button
              class="rounded bg-gray-100 p-2 text-gray-600 transition hover:text-gray-600/75 dark:bg-gray-800 dark:text-white dark:hover:text-white/75"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="size-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

<body class="bg-[#101010]">
  <div class="gradient"></div>
  <app-root></app-root>
</body>
<footer class="bg-[#101010]">
  <div class="relative mx-auto max-w-screen-xl px-4 py-16 sm:px-6 lg:px-8 lg:pt-24">
    <div class="lg:flex lg:items-end lg:justify-between">
      <div>
        <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-8"/>
        <p
          class="mx-auto mt-6 max-w-md text-center leading-relaxed text-gray-500 lg:text-left dark:text-gray-400"

        © 2025 NovaCorp. Made with ❤️ for your ❤️.
        </p>
      </div>

      <ul
        class="mt-12 flex flex-wrap justify-center gap-6 md:gap-8 lg:mt-0 lg:justify-end lg:gap-12"

            class="text-gray-700 transition hover:text-gray-700/75 dark:text-white dark:hover:text-pink-400"

          >
            Analysis
          </a>

        <li>
          <a
            class="text-gray-700 transition hover:text-gray-700/75 dark:text-white dark:hover:text-pink-400"
            href="/skinCheck"
          >
            Skin check
          </a>
        </li>

        <li>
          <a
            class="text-gray-700 transition hover:text-gray-700/75 dark:text-white dark:hover:text-pink-400"
            href="/medecineSearch"
          >
            Medecine search
          </a>
        </li>
      </ul>
    </div>
  </div>
</footer>
