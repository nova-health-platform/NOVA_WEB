<section class="min-h-screen w-full flex items-center justify-center py-8">
  <div class="w-full max-w-6xl mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-8 border-b border-white/10 text-center">
        <h1 class="text-3xl font-semibold text-white mb-4">Choose Your Plan</h1>
        <p class="text-white/60 text-base">Upgrade to unlock more features and remove limits. Cancel anytime.</p>
      </div>

      <!-- Content -->
      <div class="p-8">
        <!-- Messages -->
        <div *ngIf="loading" class="bg-white/5 border border-white/10 rounded-lg p-4 mb-6 text-center">
          <div class="flex items-center justify-center gap-3">
            <div class="spinner"></div>
            <span class="text-green-400 font-semibold">Redirecting to payment...</span>
          </div>
        </div>
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/20 rounded-lg p-4 mb-6 text-center">
          <span class="text-red-400 font-semibold">{{ errorMessage }}</span>
        </div>
        <div *ngIf="successMessage" class="bg-green-500/10 border border-green-500/20 rounded-lg p-4 mb-6 text-center">
          <span class="text-green-400 font-semibold">{{ successMessage }}</span>
        </div>

        <!-- Plans -->
        <div class="grid md:grid-cols-3 gap-6">
          <div *ngFor="let plan of plans; let i = index"
            class="bg-white/5 border border-white/10 rounded-lg p-6 relative flex flex-col"
            [class.border-green-700]="i === 1"
            [class.border-2]="i === 1">
            
            <!-- Most Popular Badge -->
            <div *ngIf="i === 1" class="absolute -top-3 left-1/2 transform -translate-x-1/2">
              <span class="bg-green-700 text-white px-3 py-1 rounded-full text-xs font-medium">Most Popular</span>
            </div>

            <div class="text-center mb-6">
              <h3 class="text-xl font-semibold text-white mb-2">{{ plan.name }}</h3>
              <div class="text-3xl font-bold text-white mb-2">
                <span *ngIf="plan.price === '0€'">0€</span>
                <span *ngIf="plan.price !== '0€'">{{ plan.price.split('/')[0] }}<span class="text-lg font-normal">/month</span></span>
              </div>
              <p class="text-white/60 text-sm">{{ plan.description }}</p>
            </div>

            <!-- Features -->
            <ul class="space-y-3 text-white/80 mb-6 flex-grow">
              <li *ngFor="let feature of plan.features" class="flex items-center gap-2">
                <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                {{ feature }}
              </li>
            </ul>

            <!-- Button -->
            <button (click)="subscribe(plan.planId)"
              class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 rounded-lg transition-all duration-200 cursor-pointer text-sm mt-auto">
              Select Plan
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
