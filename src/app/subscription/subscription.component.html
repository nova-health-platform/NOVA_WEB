<section class="min-h-screen flex justify-center items-center bg-[#101010] py-10">
  <div class="max-w-7xl mx-auto text-center text-white">
    <h1 class="text-5xl font-extrabold mb-6">Choose Your Plan</h1>
    <p class="text-gray-400 mb-12 max-w-2xl mx-auto">
      Upgrade to unlock more features and remove limits. Cancel anytime.
    </p>

    <div *ngIf="loading" class="text-pink-500 font-semibold mb-4">Redirecting to payment...</div>
    <div *ngIf="errorMessage" class="text-red-500 font-semibold mb-4">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="text-green-500 font-semibold mb-4">{{ successMessage }}</div>

    <!-- Plans -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let plan of plans"
        class="bg-white/5 rounded-2xl shadow-lg p-8 border border-gray-700 hover:border-pink-500 transition">
        <h2 class="text-3xl font-bold mb-3">{{ plan.name }}</h2>
        <p class="text-pink-400 text-2xl font-semibold mb-3">{{ plan.price }}</p>
        <p class="text-gray-400 mb-6">{{ plan.description }}</p>

        <!-- Features -->
        <ul class="text-left text-sm space-y-2 mb-6">
          <li *ngFor="let feature of plan.features" class="flex items-center">
            <svg class="w-4 h-4 text-pink-500 mr-2" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            {{ feature }}
          </li>
        </ul>

        <!-- Button -->
        <button (click)="subscribe(plan.planId)"
          class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-xl transition">
          Select Plan
        </button>
      </div>
    </div>
  </div>
</section>
