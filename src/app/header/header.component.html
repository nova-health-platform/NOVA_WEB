<header class="bg-[#101010]">
  <div class="mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex-1 md:flex md:items-center md:gap-12">
        <a href="/">
          <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-7">
        </a>
      </div>

      <div class="md:flex md:items-center md:gap-12">
        <!-- Navigation -->
        <nav aria-label="Global" class="hidden md:block">
          <ul class="flex items-center gap-6 text-sm">
            <li><a class="text-gray-500 hover:text-pink-400 dark:text-white" routerLink="/">Home</a></li>
            <li><a class="text-gray-500 hover:text-pink-400 dark:text-white" routerLink="/analysis">Symptom analysis</a></li>
            <li><a class="text-gray-500 hover:text-pink-400 dark:text-white" routerLink="/skinCheck">Skin check</a></li>
            <li><a class="text-gray-500 hover:text-pink-400 dark:text-white" routerLink="/mentalHealth">Mental health</a></li>
            <li><a class="text-gray-500 hover:text-pink-400 dark:text-white" routerLink="/medecineSearch">Medecine search</a></li>
          </ul>
        </nav>

        <!-- ✅ Boutons -->
        <div class="flex items-center gap-4">
          <!-- Not logged in -->
<ng-container *ngIf="!(isLoggedIn$ | async)">
  <a class="rounded-md bg-pink-500 px-5 py-3 text-sm font-medium text-white hover:bg-pink-600"
     routerLink="/login">
    Login
  </a>
  <a class="rounded-md px-5 py-2.5 text-sm font-medium bg-pink-500/10 border-2 border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-white"
     routerLink="/register">
    Register
  </a>
</ng-container>

<!-- Logged in -->
<ng-container *ngIf="isLoggedIn$ | async">
  <div class="relative">
    <button (click)="toggleMenu()" class="rounded-md bg-pink-500 px-5 py-2 text-white flex items-center gap-2">
      Account
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Dropdown -->
    <div *ngIf="menuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg text-gray-700 z-10">
      <a routerLink="/subscription" class="block px-4 py-2 hover:bg-pink-100">Subscription</a>
      <a routerLink="/account" class="block px-4 py-2 hover:bg-pink-100">Account</a>
      <button (click)="logout()" class="block w-full text-left px-4 py-2 hover:bg-pink-100">Logout</button>
    </div>
  </div>
</ng-container>

        </div>
      </div>
    </div>
  </div>
</header>
