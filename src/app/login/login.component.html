<!-- Loading overlay -->
<div *ngIf="loading" 
     class="fixed inset-0 z-50 bg-[#101010] flex items-center justify-center transition-opacity duration-500">
  <div class="text-white text-xl flex flex-col items-center">
    <div class="spinner"></div>
    <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-7 mt-5">
  </div>
</div>

<section class="min-h-screen w-full flex items-center justify-center bg-[#101010] pt-30 pb-30">
  <div class="w-full max-w-md mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-8 border-b border-white/10 text-center">
        <h1 class="text-3xl font-semibold text-white mb-3">Welcome Back</h1>
        <p class="text-white/60 text-base">Sign in to your Nova account</p>
      </div>

      <!-- Content -->
      <div class="p-8">
        <!-- Error/Success Messages -->
        <div *ngIf="errorMessage" class="bg-red-500/20 border border-red-500/30 text-red-400 p-3 rounded-lg mb-4 text-sm">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="bg-green-500/20 border border-green-500/30 text-green-400 p-3 rounded-lg mb-4 text-sm">
          {{ successMessage }}
        </div>

        <!-- Login Form -->
        <form (ngSubmit)="login()" class="space-y-4">
          <!-- Email Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="email" 
                name="email" 
                type="email"
                placeholder="Enter your email address" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                required>
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="password" 
                name="password" 
                type="password" 
                placeholder="Enter your password" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                required>
            </div>
          </div>

          <!-- Login Button -->
          <button 
            [disabled]="loading" 
            type="submit" 
            class="w-full bg-green-700 text-white font-semibold py-3 rounded-lg hover:bg-green-800 disabled:bg-gray-600/50 disabled:cursor-not-allowed transition-all duration-200 cursor-pointer text-sm">
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>
        </form>

        <!-- Register Link -->
        <div class="mt-8 pt-6 border-t border-white/10">
          <p class="text-sm text-center text-white/70">
            Don't have an account?
            <a href="/register" class="text-green-400 hover:text-green-300 font-semibold transition-colors duration-200 ml-1">Create one here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
