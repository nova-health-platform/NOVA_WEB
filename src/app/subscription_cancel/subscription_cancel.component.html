<section class="min-h-screen flex justify-center items-center bg-[#101010] text-white text-center p-6">
  <div class="bg-white/5 rounded-2xl p-10 max-w-lg shadow-xl">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 mx-auto text-red-500 mb-4" fill="none"
      viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
    <h1 class="text-4xl font-bold mb-4">Payment Canceled</h1>
    <p class="text-gray-400 mb-6">Your subscription was not completed. You can try again anytime.</p>
    <button (click)="retryPayment()"
      class="bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-6 rounded-lg transition">
      Retry Payment
    </button>
  </div>
</section>
