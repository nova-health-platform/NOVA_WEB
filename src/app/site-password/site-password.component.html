<section class="min-h-screen w-full flex items-center justify-center bg-[#101010] px-4">
  <div class="w-full max-w-sm mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-lg border border-white/10">
      <!-- Header -->
      <div class="p-6 text-center border-b border-white/10">
        <!-- Logo clair (light mode) -->
        <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-7 mx-auto mb-3 block dark:hidden">
        <!-- Logo sombre (dark mode) -->
        <img src="/assets/nova_logo_dark.png" alt="Nova Logo Dark" class="h-7 mx-auto mb-3 hidden dark:block">
        <h1 class="text-lg font-medium text-white mb-2">Protected Access</h1>
        <p class="text-white/50 text-xs">Under construction</p>
      </div>

      <!-- Content -->
      <div class="p-6">
        <!-- Construction Message -->
        <div class="mb-5">
          <p class="text-white/60 text-xs text-center mb-3">
            Request access at:
          </p>
          <div class="border border-green-500/20 rounded px-3 py-2 mb-3 text-center">
            <a href="mailto:novahealthtechnologies&#64;gmail.com" class="text-green-400 hover:text-green-300 transition-colors text-xs font-mono">
              novahealthtechnologies&#64;gmail.com
            </a>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-white/10 pt-4 mb-4">
          <p class="text-white/50 text-xs text-center mb-3">Already have access?</p>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-2 rounded mb-3 text-xs">
          {{ errorMessage }}
        </div>

        <!-- Password Form -->
        <form (ngSubmit)="onSubmit()" class="space-y-3">
          <!-- Password Input -->
          <div>
            <div class="relative">
              <input 
                [(ngModel)]="password" 
                name="password" 
                type="password" 
                placeholder="Password" 
                class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-green-600/50 focus:border-green-600/50 transition-all text-xs" 
                required
                autofocus>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            [disabled]="loading" 
            type="submit" 
            class="w-full bg-green-700 text-white font-medium py-2 rounded hover:bg-green-800 disabled:bg-gray-600/50 disabled:cursor-not-allowed transition-all text-xs">
            {{ loading ? 'Verifying...' : 'Access' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
