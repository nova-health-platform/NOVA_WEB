<section class="min-h-screen w-full flex items-center justify-center">
  <div class="w-full max-w-2xl mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-4 border-b border-white/10 text-center text-white font-semibold">
        Upgrade Successful!
      </div>
      
      <!-- Subtitle -->
      <div class="p-4 text-center">
        <p class="text-white/60 max-w-2xl mx-auto">
          Your subscription has been upgraded successfully. Your new plan is now active with enhanced features.
        </p>
      </div>

      <!-- Content -->
      <div class="p-4">
        <div class="bg-green-500/10 border border-green-500/30 rounded-xl p-4 mb-6">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-green-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-green-300 text-sm">Your account has been updated with your new subscription plan.</p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3">
          <button (click)="goToAccount()"
            class="flex-1 bg-blue-500 hover:bg-blue-600 hover:scale-105 cursor-pointer rounded-lg py-3 px-6 text-sm font-medium text-white transition-all duration-200 transform">
            View Account
          </button>
          <button (click)="goToAnalysis()"
            class="flex-1 bg-green-500 hover:bg-green-600 hover:scale-105 cursor-pointer rounded-lg py-3 px-6 text-sm font-medium text-white transition-all duration-200 transform">
            Start Analysis
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
