<!-- Loading overlay -->
<div *ngIf="loading" 
     class="fixed inset-0 z-50 bg-[#101010] flex items-center justify-center transition-opacity duration-500">
  <div class="text-white text-xl flex flex-col items-center">
    <div class="spinner"></div>
    <img src="/assets/nova_logo.png" alt="Nova Logo" class="h-7 mt-5">
  </div>
</div>

<section class="min-h-screen w-full flex items-center justify-center bg-[#101010] py-8 pt-30 pb-30">
  <div class="w-full max-w-md mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-8 border-b border-white/10 text-center">
        <h1 class="text-3xl font-semibold text-white mb-3">Create Account</h1>
        <p class="text-white/60 text-base">Join Nova and start your health journey</p>
      </div>

      <!-- Content -->
      <div class="p-8">
        <!-- Error/Success Messages -->
        <div *ngIf="errorMessage" class="bg-red-500/20 border border-red-500/30 text-red-400 p-3 rounded-lg mb-4 text-sm">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="bg-green-500/20 border border-green-500/30 text-green-400 p-3 rounded-lg mb-4 text-sm">
          {{ successMessage }}
        </div>

        <!-- Register Form -->
        <form (ngSubmit)="register()" class="space-y-4">
          <!-- Name Fields -->
          <div class="grid grid-cols-2 gap-3">
            <!-- First Name -->
            <div>
              <label class="block text-sm font-medium text-white/90 mb-2">First Name</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                </div>
                <input 
                  [(ngModel)]="first_name" 
                  name="first_name" 
                  type="text"
                  placeholder="First name" 
                  class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                  required>
              </div>
            </div>

            <!-- Last Name -->
            <div>
              <label class="block text-sm font-medium text-white/90 mb-2">Last Name</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                </div>
                <input 
                  [(ngModel)]="last_name" 
                  name="last_name" 
                  type="text"
                  placeholder="Last name" 
                  class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                  required>
              </div>
            </div>
          </div>

          <!-- Email Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="email" 
                name="email" 
                type="email"
                placeholder="Enter your email address" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                required>
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="password" 
                name="password" 
                type="password" 
                placeholder="Create a strong password" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                required>
            </div>
          </div>

          <!-- Confirm Password Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Confirm Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="confirmPassword" 
                name="confirmPassword" 
                type="password" 
                placeholder="Confirm your password" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                required>
            </div>
          </div>

          <!-- Phone Input -->
          <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Phone Number <span class="text-white/50 text-xs">(Optional)</span></label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                </svg>
              </div>
              <input 
                [(ngModel)]="phone" 
                name="phone" 
                type="tel"
                placeholder="Enter your phone number" 
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm">
            </div>
          </div>

          <!-- Country Input -->
      <div>
            <label class="block text-sm font-medium text-white/90 mb-2">Country</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <input 
                type="text" 
                [(ngModel)]="country" 
                name="country" 
                placeholder="Select your country"
               (input)="filterCountries($event)"
                (focus)="showCountryDropdown = true"
                (blur)="hideCountryDropdown()"
                class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-600/50 focus:border-green-600/50 transition-all duration-200 text-sm" 
                autocomplete="off" 
                required>
              
              <!-- Country Dropdown -->
              <div *ngIf="showCountryDropdown && filteredCountries.length > 0" 
                   class="absolute z-10 w-full mt-1 bg-[#1a1a1a] border border-white/10 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                <div *ngFor="let c of filteredCountries" 
                     (click)="country = c.name; filteredCountries=[]; showCountryDropdown = false"
                     class="p-2 text-white text-sm hover:bg-white/10 cursor-pointer transition-colors border-b border-white/5 last:border-b-0">
            {{ c.name }}
                </div>
          </div>
        </div>
      </div>

          <!-- Consent Checkboxes -->
          <div class="space-y-3">
            <div class="flex items-start gap-3">
              <input 
                type="checkbox" 
                [(ngModel)]="consent_rgpd" 
                name="consent_rgpd" 
                class="mt-1 w-4 h-4 text-green-600 bg-white/5 border-white/20 rounded focus:ring-green-500 focus:ring-2">
              <label class="text-xs text-white/80 leading-relaxed">
                I agree to the <a href="/terms-of-use" class="text-green-400 hover:text-green-300 underline">Terms of Use</a> and data processing terms (RGPD)
              </label>
            </div>
            <div class="flex items-start gap-3">
              <input 
                type="checkbox" 
                [(ngModel)]="consent_hipaa" 
                name="consent_hipaa" 
                class="mt-1 w-4 h-4 text-green-600 bg-white/5 border-white/20 rounded focus:ring-green-500 focus:ring-2">
              <label class="text-xs text-white/80 leading-relaxed">
                I consent to the processing of my health data according to HIPAA standards
              </label>
      </div>
      </div>

          <!-- Register Button -->
          <button 
            [disabled]="loading" 
            type="submit" 
            class="w-full bg-green-700 text-white font-semibold py-3 rounded-lg hover:bg-green-800 disabled:bg-gray-600/50 disabled:cursor-not-allowed transition-all duration-200 cursor-pointer text-sm">
            {{ loading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

        <!-- Login Link -->
        <div class="mt-8 pt-6 border-t border-white/10">
          <p class="text-sm text-center text-white/70">
      Already have an account?
            <a routerLink="/login" class="text-green-400 hover:text-green-300 font-semibold transition-colors duration-200 ml-1">Sign in here</a>
    </p>
        </div>
      </div>
    </div>
  </div>
</section>
