<section class="min-h-screen w-full flex items-center justify-center">
  <div class="w-full max-w-6xl mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-4 border-b border-white/10 text-center text-white font-semibold">
        Choose Your Plan
      </div>
      
      <!-- Subtitle -->
      <div class="p-4 text-center">
        <p class="text-white/60 max-w-2xl mx-auto">
          Upgrade to unlock more features and remove limits. Cancel anytime.
        </p>
      </div>


      <!-- Status Messages -->
      <div class="p-4 border-b border-white/10" *ngIf="loading || errorMessage || successMessage">
        <div *ngIf="loading" class="bg-green-500/10 border border-green-500/30 rounded-xl p-4 text-center">
          <div class="flex items-center justify-center gap-3">
            <div class="spinner w-5 h-5"></div>
            <p class="text-green-400 font-medium">Upgrading your plan...</p>
          </div>
        </div>
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-center">
          <p class="text-red-400 font-medium">{{ errorMessage }}</p>
        </div>
        <div *ngIf="successMessage" class="bg-green-500/10 border border-green-500/30 rounded-xl p-4 text-center">
          <p class="text-green-400 font-medium">{{ successMessage }}</p>
        </div>
      </div>

      <!-- Plans -->
      <div class="p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div *ngFor="let plan of plans"
            class="bg-[#101010]/80 border border-white/10 rounded-2xl p-6 hover:border-white/20 transition-all duration-200 flex flex-col h-full">
            
            <!-- Plan Header -->
            <div class="text-center mb-6 relative">
              <h2 class="text-2xl font-bold text-white mb-2">{{ plan.name }}</h2>
              <p class="text-green-400 text-xl font-semibold mb-3">{{ plan.price }}</p>
              <p class="text-white/60 text-sm">{{ plan.description }}</p>
              
              <!-- Current Plan Badge -->
              <div *ngIf="currentUser && currentUser.subscription_plan === plan.planId" 
                   class="absolute -top-2 -right-2 bg-green-500 text-white text-xs font-medium px-2 py-1 rounded-full">
                Current Plan
              </div>
            </div>

            <!-- Features -->
            <div class="mb-6 flex-grow">
              <ul class="space-y-3">
                <li *ngFor="let feature of plan.features" class="flex items-start gap-3">
                  <svg class="w-4 h-4 text-green-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                  <span class="text-white/80 text-sm">{{ feature }}</span>
                </li>
              </ul>
            </div>

            <!-- Button -->
            <button (click)="subscribe(plan.planId)"
              [ngClass]="{
                'bg-green-500 hover:bg-green-600 hover:scale-105 cursor-pointer': currentUser && currentUser.subscription_plan !== plan.planId,
                'bg-gray-600 text-white/40': currentUser && currentUser.subscription_plan === plan.planId
              }"
              [disabled]="currentUser && currentUser.subscription_plan === plan.planId"
              class="w-full flex items-center justify-center px-6 py-3 text-sm font-medium text-white rounded-lg transition-all duration-200 transform mt-auto">
              {{ currentUser && currentUser.subscription_plan === plan.planId ? 'Current Plan' : (plan.planId === 'free' ? 'Select Plan' : 'Upgrade Now') }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
