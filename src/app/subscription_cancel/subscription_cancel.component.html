<section class="min-h-screen w-full flex items-center justify-center">
  <div class="w-full max-w-2xl mx-auto">
    <div class="bg-[#101010] dark:bg-white/5 backdrop-blur-md rounded-2xl border border-white/10">
      <!-- Header -->
      <div class="p-4 border-b border-white/10 text-center text-white font-semibold">
        Plan Downgraded
      </div>
      
      <!-- Subtitle -->
      <div class="p-4 text-center">
        <p class="text-white/60 max-w-2xl mx-auto">
          Your subscription has been changed to the Free plan. You can upgrade again anytime to access premium features.
        </p>
      </div>

      <!-- Content -->
      <div class="p-4">
        <div class="bg-orange-500/10 border border-orange-500/30 rounded-xl p-4 mb-6">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-orange-300 text-sm">You're now on the Free plan with basic features. Upgrade anytime for more capabilities.</p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3">
          <button (click)="goToAccount()"
            class="flex-1 bg-blue-500 hover:bg-blue-600 hover:scale-105 cursor-pointer rounded-lg py-3 px-6 text-sm font-medium text-white transition-all duration-200 transform">
            View Account
          </button>
          <button (click)="retryUpgrade()"
            class="flex-1 bg-green-500 hover:bg-green-600 hover:scale-105 cursor-pointer rounded-lg py-3 px-6 text-sm font-medium text-white transition-all duration-200 transform">
            Upgrade Again
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
